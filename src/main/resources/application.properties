spring.application.name=sunset

server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/sunsetbeach}
spring.datasource.username=${DATABASE_USER:sunsetbeach}
spring.datasource.password=${DATABASE_PASSWORD:sunsetbeach}

# HikariCP defaults to a 30s connection-timeout, so a wrong DATABASE_URL host
# (e.g. host.docker.internal vs. the neighbor compose project's DB container
# name - see docker-compose.yml) fails slowly, and by the time Hibernate gives
# up trying to determine the DB dialect the real cause (DNS failure, refused
# connection, bad password) is buried under a generic "Unable to determine
# Dialect without JDBC metadata" error. Fail fast instead so the actual
# java.sql.SQLException/UnknownHostException shows up in the pool init log
# within a few seconds. Raise DB_CONNECTION_TIMEOUT_MS if a slow/loaded DB
# needs more headroom.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
# Fail the pool (and app startup) immediately on the first bad connection
# attempt instead of retrying lazily in the background - this is HikariCP's
# default (1), kept explicit here since it's load-bearing for fast failure.
spring.datasource.hikari.initialization-fail-timeout=1

# This app now owns the schema (see Flyway below) - Hibernate still only validates
# at startup, DDL changes go through db/migration, not ddl-auto.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The schema was originally created by Prisma migrations, which always quote identifiers
# and preserve exact camelCase - without these two settings Spring Boot's default naming
# strategy would mangle e.g. basePrice -> base_price and break schema validation. Kept as
# Flyway takes over DDL, since existing tables/columns still use that casing.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway now owns schema migrations going forward. baseline-on-migrate lets it adopt the
# already-existing (Prisma-created) schema as version 1 on first run instead of trying to
# recreate it - see db/migration/V1__baseline.sql for why that file is a no-op.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema (created by Prisma migrations)

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# HMAC-SHA256 signing key for the JWTs issued by POST /auth/login. Must be set via env in
# any real environment (no default - a shared fallback here would defeat the point of a
# secret). Needs to be at least 32 bytes for HS256; generate with e.g. `openssl rand -base64 32`.
app.security.jwt-secret=${JWT_SECRET}
# How long an issued JWT stays valid before the client must log in again.
app.security.jwt-ttl-days=${JWT_TTL_DAYS:7}

# HMAC-SHA256 signing key for GuestAccount JWTs (POST /guest-auth/verify|login) - deliberately a
# separate secret from app.security.jwt-secret above, never the same value. This is the actual
# safety boundary between the two identity systems: a guest token can never verify against the
# staff key or vice versa, even if a filter were misconfigured later. Must be set via env in any
# real environment, same reasoning as JWT_SECRET.
app.security.guest-jwt-secret=${GUEST_JWT_SECRET}
app.security.guest-jwt-ttl-days=${GUEST_JWT_TTL_DAYS:30}

# How long a POST /guest-auth/register|resend-verification link stays valid before
# GuestAccountService#verify rejects it as expired.
app.guest-account.verification-ttl-hours=${GUEST_ACCOUNT_VERIFICATION_TTL_HOURS:24}

app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:The Sunset Beach Resort & Spa <bookings@sunsetbeach.example>}
app.email.site-url=${NEXTAUTH_URL:}

# Root directory room images are written to/served from, mirroring the Next.js app's public/uploads/rooms/{id}/.
app.uploads.root=${UPLOADS_ROOT:./uploads}

# Comma-separated list of origins allowed to call this API with credentials (the
# next-auth.session-token cookie). No wildcard - see CorsConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Spa opening hours + grid slot size - the one place these live. GET /spa-appointments returns
# them in every response so the frontend grid never hardcodes a value the server wouldn't accept
# (see CLAUDE.md's SPA module notes). Deliberately just three properties, not a settings screen -
# changing them means editing this file and redeploying, which is fine for something that changes
# about as often as the hotel's actual opening hours do.
app.spa.opening-time=${SPA_OPENING_TIME:09:00}
app.spa.closing-time=${SPA_CLOSING_TIME:20:00}
app.spa.slot-minutes=${SPA_SLOT_MINUTES:30}

# How long after a treatment's scheduled end an order opened against its table still counts as
# "for" that appointment (OrderService#linkSpaAppointment) - the guest getting dressed and
# walking to reception is not instant, so the order is routinely opened a few minutes after the
# slot's own end time, not during it. 30 minutes: long enough to cover that walk without reaching
# into a typical next slot far enough to misattribute it (the shortest treatments on this grid
# are still a 30-minute slot).
app.spa.order-link-grace-minutes=${SPA_ORDER_LINK_GRACE_MINUTES:30}

# Container healthcheck: only /api/actuator/health is exposed and it's permitAll'd in SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Shared secret the SiteMinder polling script sends as X-Integration-Key on
# POST /integrations/siteminder/reservations (see IntegrationKeyAuthFilter). Unset = the import is
# off (every call 401). Generate with e.g. `openssl rand -base64 32`.
app.integrations.siteminder.api-key=${SITEMINDER_INTEGRATION_KEY:}

# Tuya cloud API (gym fans and air conditioners - see GymDeviceService). The project's Access ID /
# Access Secret and the regional endpoint from iot.tuya.com (Cloud -> project -> Overview). Any of
# the three unset = the integration is off and the gym page says so. Never logged.
app.tuya.client-id=${TUYA_CLIENT_ID:}
app.tuya.client-secret=${TUYA_CLIENT_SECRET:}
app.tuya.api-base=${TUYA_API_BASE:}
# How long a relay's state read is reused before asking Tuya again. The trial quota is about 26 000
# calls a month, so nothing polls; this only absorbs several people opening the page together.
app.tuya.state-cache-seconds=${TUYA_STATE_CACHE_SECONDS:30}
# Shown next to the call counter in settings. Informational only - nothing is enforced from it.
app.tuya.monthly-quota-hint=${TUYA_MONTHLY_QUOTA_HINT:26000}
# After a relay command Tuya's cloud needs about a second to show the new state; the confirming read waits this long.
app.tuya.confirm-delay-ms=${TUYA_CONFIRM_DELAY_MS:1500}

# WLED lighting controllers on the hotel LAN (see LightingService / CLAUDE.md "Lighting (WLED)").
# Connect timeout and whole-request timeout of one call to a controller; a dead controller costs the page one of these.
app.lighting.connect-timeout-ms=${LIGHTING_CONNECT_TIMEOUT_MS:2000}
app.lighting.request-timeout-ms=${LIGHTING_REQUEST_TIMEOUT_MS:2500}
# How long a controller's state read is reused (nothing polls; this absorbs several people opening the page).
app.lighting.state-cache-seconds=${LIGHTING_STATE_CACHE_SECONDS:10}
# WLED applies a preset a moment after the request; the confirming read waits this long.
app.lighting.confirm-delay-ms=${LIGHTING_CONFIRM_DELAY_MS:300}
# Comma-separated CIDRs a controller address must be inside, on top of "private" (10/8, 172.16/12, 192.168/16).
# Empty = any private address. Set it to the hotel LAN (e.g. 192.168.1.0/24) so the docker networks on this
# server (also 172.16/12) are out of reach.
app.lighting.allowed-cidrs=${LIGHTING_ALLOWED_CIDRS:}
