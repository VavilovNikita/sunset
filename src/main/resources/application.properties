spring.application.name=sunset

server.servlet.context-path=/api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/sunsetbeach}
spring.datasource.username=${DATABASE_USER:sunsetbeach}
spring.datasource.password=${DATABASE_PASSWORD:sunsetbeach}

# HikariCP defaults to a 30s connection-timeout, so a wrong DATABASE_URL host
# (e.g. host.docker.internal vs. the neighbor compose project's DB container
# name - see docker-compose.yml) fails slowly, and by the time Hibernate gives
# up trying to determine the DB dialect the real cause (DNS failure, refused
# connection, bad password) is buried under a generic "Unable to determine
# Dialect without JDBC metadata" error. Fail fast instead so the actual
# java.sql.SQLException/UnknownHostException shows up in the pool init log
# within a few seconds. Raise DB_CONNECTION_TIMEOUT_MS if a slow/loaded DB
# needs more headroom.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
# Fail the pool (and app startup) immediately on the first bad connection
# attempt instead of retrying lazily in the background - this is HikariCP's
# default (1), kept explicit here since it's load-bearing for fast failure.
spring.datasource.hikari.initialization-fail-timeout=1

# Schema is owned by Prisma migrations on the Next.js side - this app never writes DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Prisma always quotes identifiers, preserving exact camelCase - without these two
# settings Spring Boot's default naming strategy would mangle e.g. basePrice -> base_price
# and break schema validation against the real (Prisma-managed) tables.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Same secret the Next.js app uses to encrypt the next-auth.session-token cookie (NextAuth v4, JWE dir/A256GCM).
app.security.nextauth-secret=${NEXTAUTH_SECRET:TsUX+C+9CiDwOX0Lgi6J/GuzObqB2ZggU9T6E5yZvKM=}

app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:The Sunset Beach Resort & Spa <bookings@sunsetbeach.example>}
app.email.site-url=${NEXTAUTH_URL:}

# Root directory room images are written to/served from, mirroring the Next.js app's public/uploads/rooms/{id}/.
app.uploads.root=${UPLOADS_ROOT:./uploads}

# Comma-separated list of origins allowed to call this API with credentials (the
# next-auth.session-token cookie). No wildcard - see CorsConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Container healthcheck: only /api/actuator/health is exposed and it's permitAll'd in SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
