services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunset-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overridable via .env; safe fallback keeps container logs readable if unset.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
      # host:port of the hotel's HTTP proxy for Telegram (DEPLOY.md, Staff notifications). Empty = straight to Telegram.
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    # Bound to loopback only: the existing reverse proxy on the VPS (in front of
    # the Next.js app) is expected to proxy /api/* to http://127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
    # Server-specific settings (which network reaches Postgres, DATABASE_URL, secrets) are NOT
    # edited here: they go in docker-compose.override.yml and .env on that server, both untracked.
    # See DEPLOY.md, "Settings that belong to one server live in untracked files".
    extra_hosts:
      # Lets DATABASE_URL use host.docker.internal when Postgres runs on the host.
      - "host.docker.internal:host-gateway"

volumes:
  uploads:
