name: Tests

# Runs the whole suite on every pull request. The deploy workflow builds the image without running
# tests, so this is the only automatic check before a merge to master goes to production.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        # Testcontainers starts PostgreSQL on the runner's Docker. The secrets are throwaway
        # values for this run only, never the production ones.
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          export GUEST_JWT_SECRET="$(openssl rand -base64 48)"
          ./mvnw -B -ntp test
