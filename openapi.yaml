openapi: 3.0.3
info:
  title: Sunset Beach Resort & Spa — Admin/Booking API
  description: >
    Contract reverse-engineered from the current Next.js route handlers under
    `app/api/**/route.ts`. It documents exactly what each route accepts and
    returns today (including quirks such as Prisma `Decimal`/`Date` JSON
    serialization), so it can serve as a migration contract for a backend
    rewrite in another language. No behavior was changed to produce this spec.
  version: "1.0.0"
  license:
    name: Proprietary
servers:
  - url: /api
    description: Relative to the deployed Next.js app origin.

tags:
  - name: Auth
    description: >
      Self-hosted authentication - this app owns the `User` table and issues/verifies
      its own JWTs. Replaces the old NextAuth.js-managed cookie session.
  - name: Rooms
    description: Room (room *type*) CRUD and image management (staff only).
  - name: RoomUnits
    description: >
      Physical room CRUD (MANAGER or above) - individual sellable units of a Room type
      ("203", "Garden Bungalow 4"), plus per-unit manual blocks (date range + reason) that
      replace the old Room-level `Availability.blockedCount`.
  - name: Pricing
    description: Per-day rate overrides for a room (staff only).
  - name: Availability
    description: >
      Day-by-day type- and unit-level availability for a room (staff only, read-only - manual
      blocking now lives on RoomUnits).
  - name: Bookings
    description: >
      Guest booking creation (public) and status management (CASHIER or above - front-desk
      day-to-day work). `GET /bookings/export` is the one MANAGER+ exception - see that
      operation.
  - name: Menu
    description: POS menu item catalog (staff reads, MANAGER or above manages).
  - name: Tables
    description: POS restaurant/bar/spa/pool tables (staff reads, MANAGER or above manages).
  - name: Orders
    description: >
      POS orders and their line items (WAITER or above opens/edits; CASHIER or above closes
      or cancels — cancel is available to WAITER too, only closing requires CASHIER).
  - name: Shifts
    description: POS cashier shift open/close and cash reconciliation (CASHIER or above).
  - name: Payments
    description: Cross-shift POS payment reporting for a date range (MANAGER or above).
  - name: Printers
    description: >
      ESC/POS network printer CRUD and connection testing (MANAGER or above), plus the durable
      print-job queue (WAITER or above, with per-role document visibility - see
      `GET /print-jobs`) including a text preview of a job's rendered content
      (`GET /print-jobs/{id}/preview`). Printing is best-effort and asynchronous where it needs
      to be: an unreachable printer never fails the order/shift operation that triggered it - it
      leaves a `PENDING`/`FAILED` `PrintJob` behind instead, retried automatically in the
      background and retriable by hand from here.
  - name: Users
    description: Staff account management (ADMIN only).
  - name: Public
    description: >
      Unauthenticated, guest-facing reads for the public site (room listing,
      room detail, monthly pricing/availability for the booking calendar) and
      static serving of uploaded room images. Distinct from the staff-only
      Rooms/Pricing/Availability tags: no session required, and availability
      here never reveals whether a blocked day is a real booking or a manual
      staff block.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email/password
      description: >
        Verifies `email`/`password` against `User.passwordHash` (bcrypt) and, on
        success, returns a JWT to send as `Authorization: Bearer <token>` on
        subsequent requests. No server-side session is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Email not found or password incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid email or password

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Create a staff user (alias of POST /users)
      description: >
        Requires an authenticated session with role `ADMIN`. Identical
        behavior to `POST /users` - see that operation for the full response/
        error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the currently authenticated user
      description: "Requires a valid `Authorization: Bearer` JWT."
      responses:
        "200":
          description: The authenticated user (no `passwordHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out
      description: >
        No-op on this side - JWTs are stateless and not revoked server-side.
        Real logout is the client discarding the token.
      security: []
      responses:
        "204":
          description: Always succeeds.

  /rooms:
    get:
      operationId: listRooms
      tags: [Rooms]
      summary: List all rooms
      description: Requires any authenticated staff session (ADMIN or MANAGER). No pagination (small hotel).
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoom
      tags: [Rooms]
      summary: Create a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoom
      tags: [Rooms]
      summary: Get a room by id
      description: Requires any authenticated staff session (ADMIN or MANAGER). Used to prefill the admin edit form.
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: updateRoom
      tags: [Rooms]
      summary: Update a room
      description: Requires any authenticated staff session (ADMIN or MANAGER). Full replacement of all `roomSchema` fields (no partial update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    delete:
      operationId: deleteRoom
      tags: [Rooms]
      summary: Delete a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: Room has existing bookings or room units and cannot be deleted (Prisma `P2003`, FK constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This room has existing bookings and can't be deleted.

  /rooms/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: uploadRoomImages
      tags: [Rooms]
      summary: Upload one or more room images
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Files
        are written to `public/uploads/rooms/{id}/` under a randomized
        filename and appended to `Room.images`. All files in the request are
        validated (type + size) before any are written; the first violation
        aborts the whole request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files. Field name must be repeated as `files` per file.
              required: [files]
      responses:
        "201":
          description: Room updated with the new image paths appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: No files provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                noFiles:
                  value: { error: "No files provided" }
                unsupportedType:
                  value: { error: "Unsupported file type: image/gif" }
                tooLarge:
                  value: { error: "photo.jpg exceeds the 8MB limit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    delete:
      operationId: deleteRoomImage
      tags: [Rooms]
      summary: Remove a room image
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Removes
        the given path from `Room.images` and, if it points under this
        room's upload directory, deletes the file from disk (best-effort —
        failure to unlink is ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Exact image path as stored in `Room.images`, e.g. `/uploads/rooms/{id}/169...-ab12cd.jpg`.
      responses:
        "200":
          description: Room updated with the image path removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: '`path` missing or not a string.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: path is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /pricing/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomPricing
      tags: [Pricing]
      summary: Get per-day prices for a room for a given month
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Base price and the resolved price for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: setRoomPricing
      tags: [Pricing]
      summary: Set a price override for a date range
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Upserts
        one `RatePlan` row per day in `[from, to]` (inclusive). Rejects
        ranges longer than 366 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceRangeInput"
      responses:
        "200":
          description: Number of days upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkUpdated"
        "400":
          description: Body failed `priceRangeSchema` validation, or the range exceeds 366 days.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                tooLarge:
                  value: { error: "Range too large (max 366 days)" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /availability/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomAvailability
      tags: [Availability]
      summary: Get day-by-day, type- and unit-level availability for a room for a given month
      description: >
        Requires CASHIER or above. Returns the full per-day inventory breakdown at the
        room-type level (`unitCount`, `blockedCount`, `bookedCount`, `availableCount`) *and* a
        per-unit breakdown (`units[]`) so staff can see exactly which physical room is
        blocked/booked/free on each day - the data both the future booking calendar grid and
        `PUT /bookings/{id}/room-unit` (also CASHIER+) are built on. A day counts as booked if
        it is covered by a non-CANCELLED booking (`checkIn <= date < checkOut`); a booking
        without an assigned unit still counts toward `bookedCount` but against no specific entry
        in `units[]`. Manual blocking is no longer done here - see the RoomUnits tag
        (`POST /room-units/{id}/blocks`).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /room-units:
    get:
      operationId: listRoomUnits
      tags: [RoomUnits]
      summary: List physical rooms
      description: >
        Requires any authenticated staff session (ADMIN/MANAGER/CASHIER/WAITER) - room numbers
        aren't sensitive, and e.g. a CASHIER needs this to pick a candidate before calling
        `PUT /bookings/{id}/room-unit`. Manual blocks (`GET /room-units/{id}/blocks`) are a
        separate, more restricted resource - see that operation.
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: string
          description: Filter to units of a single room type.
      responses:
        "200":
          description: Matching room units.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoomUnit
      tags: [RoomUnits]
      summary: Create a physical room
      description: Requires MANAGER or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitInput"
      responses:
        "201":
          description: Room unit created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "400":
          description: Body failed validation, or `roomId` does not reference an existing room type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "409":
          description: '`label` is already in use by another room unit (unique hotel-wide).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This label is already in use by another room.

  /room-units/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomUnit
      tags: [RoomUnits]
      summary: Get a physical room by id
      description: Requires any authenticated staff session (ADMIN/MANAGER/CASHIER/WAITER).
      responses:
        "200":
          description: The room unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateRoomUnit
      tags: [RoomUnits]
      summary: Rename or (de)activate a physical room
      description: >
        Requires MANAGER or above. Full replacement of `label`/`isActive` (no partial update).
        The room type (`roomId`) is fixed at creation and cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitUpdateInput"
      responses:
        "200":
          description: Updated room unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnit"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            `label` collides with another room unit, or deactivating (`isActive: false`) is
            rejected because this unit has a non-cancelled booking assigned with a future
            checkout date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                labelTaken:
                  value: { error: This label is already in use by another room. }
                hasUpcomingBooking:
                  value: { error: "Room 203 has an upcoming booking assigned and can't be deactivated." }
    delete:
      operationId: deleteRoomUnit
      tags: [RoomUnits]
      summary: Delete a physical room
      description: Requires MANAGER or above. Also deletes this unit's blocks.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: This room unit has a non-cancelled booking assigned with a future checkout date and can't be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Room 203 has an upcoming booking assigned and can't be deleted."

  /room-units/{id}/blocks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listRoomUnitBlocks
      tags: [RoomUnits]
      summary: List manual blocks for a physical room
      description: >
        Requires MANAGER or above - deliberately more restricted than `GET /room-units`/
        `GET /room-units/{id}`, which any staff role may call. `reason` is free text staff write
        for each other and can carry internal notes, so this list is not exposed to CASHIER/
        WAITER the way the room list itself is; do not assume the two endpoints share visibility.
      responses:
        "200":
          description: Blocks for this room unit.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomUnitBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createRoomUnitBlock
      tags: [RoomUnits]
      summary: Pull a physical room off sale for a date range
      description: >
        Requires MANAGER or above. Does not touch bookings - a block only affects the
        availability calculation. Overlapping blocks on the same unit are allowed (not merged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitBlockInput"
      responses:
        "201":
          description: Block created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnitBlock"
        "400":
          description: Body failed validation (includes `fromDate <= toDate`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /room-units/{id}/blocks/{blockId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: blockId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteRoomUnitBlock
      tags: [RoomUnits]
      summary: Remove a manual block
      description: Requires MANAGER or above.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Room unit or block not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: List bookings
      description: >
        Requires CASHIER or above - finding a guest's booking is front-desk work, not a
        MANAGER-only report (contrast with `GET /bookings/export`, which stays MANAGER+: a
        single-booking lookup and a bulk CSV of every guest's contact details are different risk
        profiles). Filters mirror `GET /bookings/export`. Ordered by `checkIn` ascending.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Matching bookings, ordered by `checkIn` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Create a booking (public — guest-facing, no session required)
      description: >
        Intentionally unauthenticated: guests are not logged in. The server
        recomputes `totalPrice` from `Room.basePrice`/`RatePlan` and
        re-validates availability itself inside a `Serializable` transaction
        — nothing the client sends about price or availability is trusted.
        Sends a new-booking notification email on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateInput"
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed `bookingCreateSchema` validation (includes `checkIn < checkOut`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: >
            Requested dates are no longer available — either lost a race to
            another booking (checked inside the transaction) or the
            underlying Postgres serialization failure (Prisma `P2034`) from
            a concurrent conflicting request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Selected dates are no longer available" }
                serializationConflict:
                  value: { error: "Someone just booked these dates — please try again." }

