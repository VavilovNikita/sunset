  /bookings/export:
    get:
      operationId: exportBookings
      tags: [Bookings]
      summary: Export bookings as CSV
      description: >
        Requires MANAGER or above - deliberately stricter than `GET /bookings`/
        `GET /bookings/{id}` (CASHIER+): those return one guest's booking at a time for a
        specific front-desk task, this returns every matching guest's name/email/phone/stay in
        one bulk file. Bulk export of personal data is a materially different risk (a leaked or
        misused CSV exposes the whole filtered set at once) from looking someone up, so it gets
        the higher bar even though the underlying data overlaps.


        The file opens with a UTF-8 BOM followed by a `sep=,` directive line so it opens
        correctly by double-click in Excel regardless of the OS's regional list-separator
        setting (a ru-RU/de-DE/etc. Windows defaults that to `;`, which is why a plain
        comma-CSV lands as one column there) - see `CsvBuilder` in the backend. Both CSV
        exports (`GET /bookings/export` and `GET /shifts/{id}/export`) share this same
        preamble/escaping so they can't drift apart.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: >
            CSV file, one row per booking, ordered by `checkIn` ascending. Prefixed with a
            UTF-8 BOM and a `sep=,` directive line (not shown in the example below) - see this
            operation's description.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  ID,Room,Guest,Email,Phone,Check-in,Check-out,Total,Status,Payment note,Created at
                  clx123,Ocean View Suite,Jane Doe,jane@example.com,+66801234567,2026-08-01,2026-08-05,24000.00,PAID,,2026-07-01T10:00:00.000Z
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Always `attachment; filename="bookings.csv"`.'
        "401":
          $ref: "#/components/responses/Unauthorized"

