        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "409":
          description: Another printer is already the active one for this `department`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
