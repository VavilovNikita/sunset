          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Printer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
    post:
      operationId: createPrinter
      tags: [Printers]
      summary: Register a printer
      description: >
        Requires role `MANAGER` or above. Activating a printer (`isActive: true`, the default)
        for a `department` that already has an active printer is rejected with 409 - deactivate
        the old one first. Use `POST /printers/{id}/test` after creating one to confirm it's
        actually reachable before relying on it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterInput"
      responses:
        "201":
          description: Printer created.
