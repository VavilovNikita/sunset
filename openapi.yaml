  /shifts/current:
    get:
      operationId: getCurrentShift
      tags: [Shifts]
      summary: Get the calling user's currently open shift
      description: >
        Requires role `CASHIER` or above. Looks up by `openedByUserId` = the calling user's id
        AND `status=OPEN` - never returns another user's shift, even to a MANAGER/ADMIN caller.
        Lets a client on any device discover whether it already has an open shift without
        relying on browser local storage.
      responses:
        "200":
          description: The calling user's open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: The calling user has no open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: No open shift

  /shifts/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closeShift
      tags: [Shifts]
      summary: Close a shift
      description: Requires role `CASHIER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCloseInput"
      responses:
        "200":
          description: Closed shift (status `CLOSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found
        "409":
          description: >
            Already `CLOSED`, or there are `OPEN`/`SENT` orders anywhere in the system. This is
            a system-wide gate, not scoped to this particular shift - `Order` has no `shiftId`
            (only `Payment` does, and only once an order is closed), so there is no way to ask
            "orders opened during this shift" and the check intentionally doesn't pretend
            otherwise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShift
      tags: [Shifts]
      summary: Get a shift summary
      description: >
        Requires role `CASHIER` or above. A caller whose role is exactly `CASHIER` (not
        `MANAGER`/`ADMIN`) may only fetch a shift they themselves opened - any other shift id
        404s for them, same as if it didn't exist, to avoid confirming another cashier's shift
        even exists. `MANAGER`/`ADMIN` can fetch any shift.
      responses:
        "200":
          description: The shift with payment totals broken out by method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /shifts/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: exportShift
      tags: [Shifts]
      summary: Export a shift's Z-report as CSV
      description: >
        Requires role `MANAGER` or above. This is the till-reconciliation report, not a raw
        payment dump: identifiers that only make sense to a database (order/booking/cashier
        UUIDs) are replaced with what a manager actually needs to read - the order's
        table/zone and item composition (or a short fallback if there's no table), the guest
        name and room for ROOM_CHARGE payments, and the cashier's email. The underlying
        `Payment.id`/`Order.id` are kept as the last two columns for support/audit lookups,
        not as the first thing a human sees. Timestamps are seconds-precision (`yyyy-MM-dd
        HH:mm:ss "UTC"`), not the millisecond ISO instant used elsewhere in the API.


        The file opens with a UTF-8 BOM and a `sep=,` directive line - see `GET
        /bookings/export`'s description for why.


        After the payment rows, a blank line separates a totals block (label, value per row):
        `Cash`/`Card`/`Other`/`Room charge (posted to room folio - not received cash/card)`
        (same per-method split and the same ROOM_CHARGE exclusion as `GET /payments/summary`
        - see that operation's description for why ROOM_CHARGE isn't received revenue),
        `Received total (cash + card + other)`, `Payments` (count), `Opening cash float`,
        `Expected cash (float + cash payments)`, `Counted cash` (the shift's
        `closingCashCounted`, or `—` if the shift hasn't been closed/recounted yet), and
        finally `Discrepancy (counted - expected)` - positive means the drawer has more cash
        than it should, negative means it's short. This last figure is the actual point of
        closing a shift.
      responses:
        "200":
          description: >
            CSV file: a header row, one row per payment recorded under this shift, a blank
            row, then the reconciliation totals block described above.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  Time,Method,Amount,Order,Guest / Room,Cashier,Payment ID,Order ID
                  2026-08-08 20:26:40 UTC,ROOM_CHARGE,1080.00,Bar – Bar Seat 3: 2× Mojito; 1× Caesar salad,Jane Doe – Ocean View Suite,cashier@sunsetbeach.example,aa89f455-...,5de7944d-...

                  Summary,
                  Cash,3200.00
                  Card,1500.00
                  Other,0.00
                  Room charge (posted to room folio - not received cash/card),1080.00
                  Received total (cash + card + other),4700.00
                  Payments,5
                  Opening cash float,2000.00
                  Expected cash (float + cash payments),5200.00
                  Counted cash,5150.00
                  Discrepancy (counted - expected),-50.00
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Always `attachment; filename="shift-{id}.csv"`.'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /payments/summary:
    get:
      operationId: getPaymentsSummary
      tags: [Payments]
      summary: Get a payment totals summary for a date range
      description: >
        Requires role `MANAGER` or above. `from`/`to` are inclusive dates, filtered by
        `Payment.createdAt`. `totals` reuses the exact same per-method aggregation
        `GET /shifts/{id}` builds `ShiftSummary.totals` from - just scoped to a date range
        across all shifts instead of one shift (see `PaymentAggregation` in the backend; the
        arithmetic is not duplicated between the two).


        **`totals.roomCharge` is not received revenue.** It's money moved onto a guest's room
        folio at the moment a POS order was closed with `method=ROOM_CHARGE` - it only becomes
        real, collected revenue if/when the underlying `Booking` itself is later paid, which is
        a separate event this endpoint does not track (see `GET /bookings/{id}/folio`).
        Including it in a revenue total here would either double-count it (once here, again
        when the booking is paid) or count it before any money actually changed hands.
        `grandTotal` is therefore **`totals.cash + totals.card + totals.other` only** -
        `totals.roomCharge` is deliberately excluded and must be read as a separate "moved to
        room folios this period" figure, never added into `grandTotal` on the client.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (by `Payment.createdAt`).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (by `Payment.createdAt`).
      responses:
        "200":
          description: Payment totals for the date range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsSummary"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List staff users
      description: Requires an authenticated session with role `ADMIN`.
      responses:
        "200":
          description: All staff users (no `passwordHash`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a staff user
      description: Requires an authenticated session with role `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use (Prisma `P2002` unique constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a staff user by id
      description: Requires an authenticated session with role `ADMIN`.
      responses:
        "200":
          description: The staff user (no `passwordHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found
    patch:
      operationId: updateUserRole
      tags: [Users]
      summary: Change a staff user's role
      description: >
        Requires an authenticated session with role `ADMIN`. An admin
        cannot change their own role (blocked before any DB write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: '`id` in the path is the caller''s own id, or body failed `userRoleUpdateSchema` validation.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                selfRoleChange:
                  value: { error: "You can't change your own role" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /public/rooms:
    get:
      operationId: listPublicRooms
      tags: [Public]
      summary: List all rooms (public)
      description: Unauthenticated. Powers the public room listing page. Nothing in `Room` is sensitive today, so it's reused as-is rather than duplicated into a narrower projection.
      security: []
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /public/rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoom
      tags: [Public]
      summary: Get a room by id (public)
      description: Unauthenticated. Powers the public room detail page.
      security: []
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /public/rooms/{id}/pricing:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomPricing
      tags: [Public]
      summary: Get per-day prices for a room for a given month (public)
      description: Unauthenticated. Same shape as the staff endpoint - `isOverride` isn't sensitive, it just means the day has an explicit rate.
      security: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Base price and the resolved price for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /public/rooms/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomAvailability
      tags: [Public]
      summary: Get day-by-day availability for a room for a given month (public)
      description: >
        Unauthenticated. Powers the guest booking calendar. Unlike the staff
        endpoint, this never reveals *why* a day is blocked (real booking vs.
        manual staff block), nor how many units remain (`availableCount`) -
        only whether at least one unit is still bookable. Exposing the exact
        remaining count would let competitors read occupancy/load straight
        off the public site.
      security: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailabilityResponse"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /uploads/rooms/{roomId}/{filename}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomImage
      tags: [Public]
      summary: Serve an uploaded room image
      description: >
        Unauthenticated. Serves files written under `UPLOADS_ROOT/rooms/{roomId}/`
        by `POST /rooms/{id}/images`. The path shape matches `Room.images`
        entries exactly (`/uploads/rooms/{id}/{filename}`); on the deployed
        VPS the reverse proxy in front of this service rewrites public
        `/uploads/...` requests to this app's `/api/uploads/...` route so
        `Room.images` values need no prefix rewriting on the frontend.
      security: []
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No such file (unknown room, unknown filename, or a path escaping the room's upload directory).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT returned by `POST /auth/login`, sent as `Authorization: Bearer
        <token>`. Contains `sub` (user id), `email`, `role`, standard `iat`/`exp`
        (default TTL 7 days, configurable via `JWT_TTL_DAYS`). Every route in
        this file except `POST /bookings` and the unauthenticated `/auth/*`
        endpoints (`login`, `logout`) requires a valid token, returning 401 if
        missing/invalid/expired, and 403 where the route additionally requires
        role `ADMIN`.

  responses:
    Unauthorized:
      description: No valid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Unauthorized
    Forbidden:
      description: Token is valid but lacks the required role (`ADMIN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenManagerPlus:
      description: Token is valid but lacks the required role (`MANAGER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenCashierPlus:
      description: Token is valid but lacks the required role (`CASHIER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden

  schemas:
    Role:
      type: string
      enum: [ADMIN, MANAGER, CASHIER, WAITER]
      description: >
        Hierarchical: ADMIN > MANAGER > CASHIER > WAITER (see RoleHierarchy bean). A role
        check written as e.g. "CASHIER" is satisfied by CASHIER, MANAGER, or ADMIN. `/users/**`
        is the one exception — hard-restricted to ADMIN regardless of hierarchy.

    Zone:
      type: string
      enum: [RESTAURANT, BAR, SPA, POOL, ROOM_SERVICE]
      description: Physical area a POS Table belongs to.

    OrderStatus:
      type: string
      enum: [OPEN, SENT, PAID, CANCELLED]
      description: >
        OPEN (being built) -> SENT (sent to kitchen/bar, still editable-ish per business
        rule) -> PAID (closed with a Payment) or CANCELLED. PAID and CANCELLED are terminal.

    PaymentMethod:
      type: string
      enum: [CASH, CARD, ROOM_CHARGE, OTHER]
      description: >
        CARD is a ledger entry recorded on the cashier's word, not a confirmation from a
        payment terminal/acquirer — there is no card-processing integration.

    ShiftStatus:
      type: string
      enum: [OPEN, CLOSED]

    BookingStatus:
      type: string
      enum: [NEW, CONFIRMED, PAID, CANCELLED]

    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
      description: 'Generic error shape used by all hand-written `{ error: "..." }` responses.'

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Output of Zod's `error.flatten()`.
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
      example:
        error:
          formErrors: []
          fieldErrors:
            guestEmail: ["Invalid email"]

    OkTrue:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    OkUpdated:
      type: object
      required: [ok, updated]
      properties:
        ok:
          type: boolean
          enum: [true]
        updated:
          type: integer
          description: Number of day rows upserted.

    Room:
      type: object
      description: >
        Raw Prisma `Room` row as returned by `NextResponse.json(...)`. Despite
        the name this is a **room type**, not a single physical room —
        `quantity` is how many sellable units of it exist; individual units
        aren't numbered or tracked yet. `basePrice` is a Prisma `Decimal` —
        it serializes to a **string**, not a JSON number. `createdAt`
        serializes as an ISO-8601 datetime string.
      required: [id, name, description, capacity, quantity, basePrice, images, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        quantity:
          type: integer
          minimum: 1
          description: How many sellable units of this room type exist.
        basePrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1500.00"`.
        images:
          type: array
          items:
            type: string
          description: Paths under `/uploads/rooms/{id}/...`.
        createdAt:
          type: string
          format: date-time

    RoomInput:
      type: object
      description: Body of `roomSchema`. Full replacement on PATCH — no partial update.
      required: [name, description, capacity, quantity, basePrice]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 10
        capacity:
          type: integer
          minimum: 1
          maximum: 20
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
        quantity:
          type: integer
          minimum: 1
          maximum: 500
          description: >
            How many sellable units of this room type exist. Lowering this
            below the peak number of units already committed (booked or
            manually blocked) on any future date is rejected with 409 — see
            `PATCH /rooms/{id}` responses.
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.

    Booking:
      type: object
      description: >
        Raw Prisma `Booking` row with `room` included. `totalPrice`
        serializes as a **string** (Prisma `Decimal`). `checkIn`, `checkOut`,
        `createdAt`, `updatedAt` serialize as ISO-8601 datetime strings
        (`checkIn`/`checkOut` are date-only columns but still render with a
        `T00:00:00.000Z` time component since Prisma returns `Date` objects).
      required:
        - id
        - roomId
        - room
        - guestName
        - guestEmail
        - guestPhone
        - checkIn
        - checkOut
        - totalPrice
        - status
        - paymentNote
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        roomId:
          type: string
        room:
          $ref: "#/components/schemas/Room"
        guestName:
          type: string
        guestEmail:
          type: string
        guestPhone:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"4500.00"`. Always server-computed, never taken from the request.
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingCreateInput:
      type: object
      description: Body of `bookingCreateSchema`.
      required: [roomId, guestName, guestEmail, guestPhone, checkIn, checkOut]
      properties:
        roomId:
          type: string
          minLength: 1
        guestName:
          type: string
          minLength: 2
          maxLength: 120
        guestEmail:
          type: string
          format: email
        guestPhone:
          type: string
          minLength: 5
          maxLength: 40
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      # Cross-field rule enforced by Zod .refine(), not expressible in JSON Schema:
      # checkIn must be strictly before checkOut.

    BookingStatusInput:
      type: object
      description: Body of `bookingStatusSchema`.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentNote:
          type: string
          maxLength: 500
          nullable: true

    User:
      type: object
      description: Safe projection returned by the API — `passwordHash` is never included.
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "JWT to send as `Authorization: Bearer <token>` on subsequent requests."
        user:
          $ref: "#/components/schemas/User"

    UserCreateInput:
      type: object
      description: Body of `userCreateSchema`.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Hashed with bcrypt (cost 10) before storage; never stored or returned in plaintext.
        role:
          $ref: "#/components/schemas/Role"
          default: MANAGER

    UserRoleUpdateInput:
      type: object
      description: Body of `userRoleUpdateSchema`.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    PriceRangeInput:
      type: object
      description: Body of `priceRangeSchema`. Upserts one `RatePlan` row per day in `[from, to]`.
      required: [from, to, price]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
      # Cross-field rule enforced by Zod .refine(): from <= to.

    AvailabilityRangeInput:
      type: object
      description: >
        Body of `availabilityRangeSchema`. Upserts one `Availability` row per
        day in `[from, to]` with `blockedCount` units of the room type pulled
        from sale. `blockedCount: 0` deletes the row for that day instead
        (zero is equivalent to no row existing).
      required: [from, to, blockedCount]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        blockedCount:
          type: integer
          minimum: 0
          description: 'Must not exceed the room''s `quantity` - rejected with 400 otherwise.'
      # Cross-field rule enforced by Zod .refine(): from <= to.

    PricingDay:
      type: object
      required: [date, price, isOverride]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          description: Explicitly converted with `Number(...)` server-side — a real JSON number, unlike `Room.basePrice`.
        isOverride:
          type: boolean
          description: 'True if this day has an explicit `RatePlan` row; false if it fell back to `Room.basePrice`.'

    PricingResponse:
      type: object
      required: [basePrice, days]
      properties:
        basePrice:
          type: number
          description: 'Room.basePrice explicitly converted with `Number(...)`.'
        days:
          type: array
          items:
            $ref: "#/components/schemas/PricingDay"

    AvailabilityDay:
      type: object
      description: >
        Per-day inventory breakdown for staff. `availableCount` is the
        derived remainder (`quantity - blockedCount - bookedCount`) and can
        go negative - that's not clamped away, since a negative remainder
        (e.g. after a `quantity` reduction) is exactly the thing staff need
        to see, not hide.
      required: [date, quantity, blockedCount, bookedCount, availableCount]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        quantity:
          type: integer
          description: 'Room.quantity at query time.'
        blockedCount:
          type: integer
          description: Units manually pulled from sale for this day (`Availability.blockedCount`).
        bookedCount:
          type: integer
          description: Units covered by a non-CANCELLED booking for this day.
        availableCount:
          type: integer
          description: 'quantity - blockedCount - bookedCount. Not clamped at 0.'

    AvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityDay"

    PublicAvailabilityDay:
      type: object
      description: >
        Like `AvailabilityDay` but collapsed to a yes/no signal - guests get
        neither the block/booking split nor the exact remaining count
        (revealing occupancy load to competitors), just whether at least one
        unit is still sellable.
      required: [date, isBlocked]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isBlocked:
          type: boolean
          description: 'True when availableCount <= 0 for this day.'

    PublicAvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityDay"

    MenuItem:
      type: object
      required: [id, name, description, category, price, isAvailable, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        price:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"250.00"` — same convention as `Room.basePrice`.
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MenuItemInput:
      type: object
      description: Full replacement on PATCH — no partial update (same convention as `RoomInput`).
      required: [name, description, category, price]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          type: string
          minLength: 1
          maxLength: 60
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        isAvailable:
          type: boolean
          default: true

    Table:
      type: object
      description: >
        A physical POS table/spot a guest tab can be opened against. Mapped to a
        `PosTable` database table (not `Table`) to sidestep the SQL keyword collision — the
        API schema name is unaffected.
      required: [id, zone, label, capacity, isActive]
      properties:
        id:
          type: string
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    TableInput:
      type: object
      description: Full replacement on PATCH — no partial update.
      required: [zone, label, capacity]
      properties:
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
          minLength: 1
          maxLength: 60
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        isActive:
          type: boolean
          default: true

    OrderItem:
      type: object
      description: A single line of an Order. `unitPrice` is a snapshot of `MenuItem.price` at the moment the item was added — later menu price changes never retroactively affect it.
      required: [id, orderId, menuItemId, quantity, unitPrice, note, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        menuItemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
          description: Decimal(10,2) rendered as a string, snapshotted at insert time.
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Order:
      type: object
      description: >
        `total` is always server-computed from `items` — never taken from the client (same
        rule as `Booking.totalPrice`).
      required: [id, tableId, bookingId, guestName, status, openedByUserId, total, note, items, createdAt, updatedAt]
      properties:
        id:
          type: string
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
        guestName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        openedByUserId:
          type: string
        total:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1250.00"`.
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreateInput:
      type: object
      description: At least one of `tableId`/`bookingId`/`guestName` is expected in practice (an order with none of them is a valid but untraceable tab), but this isn't enforced server-side — same "trust the caller on shape, not on price" spirit as elsewhere.
      properties:
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
        guestName:
          type: string
          nullable: true
          maxLength: 120

    OrderUpdateInput:
      type: object
      description: >
        Partial update (unlike `RoomInput`/`MenuItemInput`/`TableInput`): an omitted field
        leaves the existing value alone, an explicit `null` on `note`/`tableId` clears it.
        The only legal `status` transition through this endpoint is `OPEN` -> `SENT`; any
        other value (including trying to set `PAID`/`CANCELLED` here instead of through
        `/close` or `/cancel`) is rejected with 400.
      properties:
        note:
          type: string
          nullable: true
          maxLength: 1000
        tableId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"

    OrderItemInput:
      type: object
      description: >
        Used both as the array body of `POST /orders/{id}/items` (create) and the single-object
        body of `PATCH /orders/{id}/items/{itemId}` (full replacement of `quantity`/`note` for
        that line — `menuItemId` is immutable after creation but still required in the body for
        symmetry with the create shape; the server ignores it on PATCH).
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
          nullable: true
          maxLength: 500

    CloseOrderInput:
      type: object
      description: >
        Body of `POST /orders/{id}/close`. No `amount` field: there's no partial-payment
        model (an `Order` goes straight to the terminal `PAID` status on the first close, it
        can't accumulate multiple payments), so the amount charged is never a client-supplied
        number - the server always charges `Order.total` exactly, the same "never trust the
        client on money" rule as `Booking.totalPrice`/`Order.total` itself. `bookingId` is
        required when `method` is `ROOM_CHARGE` — a cross-field rule enforced server-side, not
        expressible in JSON Schema (same pattern as `BookingCreateInput`'s `checkIn < checkOut`).
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        bookingId:
          type: string

    Payment:
      type: object
      required: [id, orderId, method, amount, bookingId, recordedByUserId, shiftId, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: string
          description: Decimal(10,2) rendered as a string.
        bookingId:
          type: string
          nullable: true
          description: Set only when `method` is `ROOM_CHARGE`.
        recordedByUserId:
          type: string
        shiftId:
          type: string
        createdAt:
          type: string
          format: date-time

    Shift:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true

    ShiftOpenInput:
      type: object
      properties:
        openingCashFloat:
          type: number
          minimum: 0

    ShiftCloseInput:
      type: object
      properties:
        closingCashCounted:
          type: number
          minimum: 0
        notes:
          type: string
          nullable: true
          maxLength: 1000

    ShiftTotals:
      type: object
      description: Sum of this shift's `Payment.amount`, broken out by method — CASH/CARD/OTHER only; ROOM_CHARGE payments settle against the room folio, not this shift's cash/card reconciliation, so they're reported separately as `roomCharge`.
      required: [cash, card, roomCharge, other, paymentCount]
      properties:
        cash:
          type: string
          description: Decimal(10,2) rendered as a string.
        card:
          type: string
          description: Decimal(10,2) rendered as a string.
        roomCharge:
          type: string
          description: Decimal(10,2) rendered as a string.
        other:
          type: string
          description: Decimal(10,2) rendered as a string.
        paymentCount:
          type: integer

    ShiftSummary:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes, totals]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true
        totals:
          $ref: "#/components/schemas/ShiftTotals"

    BookingPosOrderItem:
      type: object
      description: Compact line-item summary - menu item name (not id) and quantity, nothing else.
      required: [name, quantity]
      properties:
        name:
          type: string
        quantity:
          type: integer

    BookingPosOrder:
      type: object
      description: One `Order` that was closed with `method=ROOM_CHARGE` against this booking.
      required: [orderId, amount, paidAt, items]
      properties:
        orderId:
          type: string
        amount:
          type: string
          description: The `Payment.amount` recorded when this order was closed - decimal(10,2) rendered as a string.
        paidAt:
          type: string
          format: date-time
          description: '`Payment.createdAt` - when the order was closed, not when the order was opened.'
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingPosOrderItem"

    BookingFolio:
      type: object
      description: >
        `folioTotal` = `roomTotal` + `roomChargesTotal`, computed on the fly by
        `BookingService.computeFolio`/`getFolio` - see that method's Javadoc. Never stored.
      required: [roomTotal, roomChargesTotal, folioTotal, roomChargeCount]
      properties:
        roomTotal:
          type: string
          description: '`Booking.totalPrice` - decimal(10,2) rendered as a string.'
        roomChargesTotal:
          type: string
          description: Sum of this booking's ROOM_CHARGE `Payment.amount` rows - decimal(10,2) rendered as a string.
        folioTotal:
          type: string
          description: '`roomTotal` + `roomChargesTotal` - decimal(10,2) rendered as a string.'
        roomChargeCount:
          type: integer
          description: Number of ROOM_CHARGE payments summed into `roomChargesTotal` - same count as `GET /bookings/{id}/pos-orders` would return entries.

    PaymentsSummary:
      type: object
      description: >
        Response of `GET /payments/summary`. See that operation's description for why
        `totals.roomCharge` is excluded from `grandTotal` - do not sum `totals.*` yourself on
        the client, use `grandTotal` as-is for received revenue.
      required: [from, to, totals, grandTotal]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totals:
          $ref: "#/components/schemas/ShiftTotals"
        grandTotal:
          type: string
          description: '`totals.cash + totals.card + totals.other` - decimal(10,2) rendered as a string. Deliberately excludes `totals.roomCharge`.'
