  /print-jobs:
    get:
      operationId: listPrintJobs
      tags: [Printers]
      summary: List print jobs
      description: >
        Requires role `WAITER` or above (i.e. any staff role) - but what comes back depends on
        who's asking. `ADMIN`/`MANAGER` see every document type. `CASHIER`/`WAITER` only see
        `KITCHEN_TICKET`/`BAR_TICKET`/`PREBILL` jobs - `Z_REPORT` (shift cash reconciliation) and
        `GUEST_RECEIPT` (booking/payment detail) are cashier/management information, filtered
        out rather than 403'd so line staff still get the one thing they actually need this
        endpoint for: seeing that their own kitchen/bar ticket or pre-bill didn't go through.
        Ordered by `createdAt` descending (most recent first). Filter by `status=FAILED` to see
        what needs manual attention - a silently lost kitchen ticket is a dish that never gets
        served - and/or by `documentType` to narrow to one kind of document (e.g.
        `documentType=Z_REPORT` for a manager auditing shift closes). Both filters apply
        server-side; an unrecognized value for either is a 400, not a silently-ignored no-op.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PrintJobStatus"
        - name: documentType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PrintDocumentType"
      responses:
        "200":
          description: Matching print jobs, filtered to the document types the caller's role may see.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /print-jobs/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: retryPrintJob
      tags: [Printers]
      summary: Manually retry a print job
      description: >
        Requires role `WAITER` or above, subject to the same per-role document-type visibility
        as `GET /print-jobs`. Attempts delivery immediately regardless of the job's current
        `status` or `attempts` count (a human asking for a retry overrides the automatic-retry
        attempt ceiling). The original `payload` is replayed byte-for-byte - this re-sends
        exactly what was originally queued, it does not regenerate the document from current
        data. A job whose document type the caller's role can't see (e.g. a `WAITER` targeting a
        `Z_REPORT` job id) returns 404, not 403 - the id must not be usable to confirm the job
        exists, let alone force a reprint of it.
      responses:
        "200":
          description: 'The job after the retry attempt (`status: SENT` or `FAILED`).'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Print job not found, or its document type isn't visible to the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Print job not found

  /print-jobs/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewPrintJob
      tags: [Printers]
      summary: Preview a print job's rendered content
      description: >
        Requires role `WAITER` or above, subject to the same per-role document-type visibility
        as `GET /print-jobs` (404, not 403, for a job outside the caller's visible set - see
        that operation's description). Returns the same text that would come out of the
        printer, with the ESC/POS control sequences (init, code page selection, bold,
        centering, paper cut) stripped out - not a hex dump of `payload`. Useful both to check a
        document before it prints and to see what a `FAILED` job actually contained without
        walking over to a dead printer.
      responses:
        "200":
          description: Plain-text rendering of the job's payload.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  KITCHEN TICKET
                  Restaurant – Table 4
                  Time: 2026-08-16 20:05:00 UTC
                  Waiter: waiter@sunsetbeach.example
                  ------------------------------------------
                  2x Caesar Salad
                     note: no croutons
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Print job not found, or its document type isn't visible to the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Print job not found

  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders
      description: Requires any authenticated staff session. Filters combine with AND.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: zone
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Zone"
          description: Filters by the zone of the order's table; orders with no table never match.
        - name: tableId
          in: query
          required: false
          schema:
            type: string
        - name: bookingId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Open a new order
      description: Requires role `WAITER` or above (i.e. any staff role — WAITER is the floor of the hierarchy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateInput"
      responses:
        "201":
          description: Order created with status `OPEN` and no items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: '`tableId` or `bookingId` given but not found.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get an order by id, with its line items
      description: Requires any authenticated staff session.
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
    patch:
      operationId: updateOrder
      tags: [Orders]
      summary: Update an order's note/table, or send it (OPEN -> SENT)
      description: Requires role `WAITER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateInput"
      responses:
        "200":
          description: Updated order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation, or `status` requested a transition other than `OPEN` -> `SENT`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found

  /orders/{id}/items:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: addOrderItems
      tags: [Orders]
      summary: Add one or more line items to an order
      description: >
        Requires role `WAITER` or above. Legal while the order is `OPEN` or `SENT` - a guest
        adding a round of drinks after the order was already sent to the kitchen is normal, and
        appending new lines doesn't retroactively change anything about the lines already sent.
        `unitPrice` is snapshotted from the current `MenuItem.price` server-side — never taken
        from the client. Unlike this endpoint, `PATCH`/`DELETE` on an individual existing line
        (`/orders/{id}/items/{itemId}`) still require the order to be `OPEN` - editing or
        removing a line that may already be in progress in the kitchen is not offered here.
        Note there is no separate "sent to kitchen" timestamp: `Order.updatedAt` is overwritten
        by this call like any other mutation, so it cannot be used to tell which lines were on
        the original ticket versus added afterward - a kitchen-facing view would need to diff
        on `OrderItem.createdAt` for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OrderItemInput"
      responses:
        "201":
          description: Updated order, with the new line(s) appended and `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found, or a `menuItemId` doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN` or `SENT` (i.e. it's already `PAID`/`CANCELLED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open or sent

  /orders/{id}/items/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateOrderItem
      tags: [Orders]
      summary: Replace a line item's quantity/note
      description: Requires role `WAITER` or above. Only legal while the order is `OPEN`. `unitPrice` is not re-snapshotted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemInput"
      responses:
        "200":
          description: Updated order, with `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order or line item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open
    delete:
      operationId: deleteOrderItem
      tags: [Orders]
      summary: Remove a line item
      description: Requires role `WAITER` or above. Only legal while the order is `OPEN`.
      responses:
        "200":
          description: Updated order, with `total` recomputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order or line item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order is not `OPEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order is not open

  /orders/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closeOrder
      tags: [Orders]
      summary: Close an order with a payment
      description: >
        Requires role `CASHIER` or above, and requires the calling user to have an `OPEN`
        `Shift` (409 otherwise). Creates a `Payment` row for `Order.total`/`method` (and
        `bookingId` when `method` is `ROOM_CHARGE`) tied to that shift, then sets the order's
        status to `PAID`. The amount charged is always `Order.total` - see `CloseOrderInput`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOrderInput"
      responses:
        "200":
          description: Closed order (status `PAID`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Body failed validation, or `method` is `ROOM_CHARGE` without a `bookingId`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Order not found, or (for `ROOM_CHARGE`) `bookingId` not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Order already `PAID`/`CANCELLED`, caller has no open shift, or (for `ROOM_CHARGE`) the booking is `CANCELLED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/print-prebill:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: printOrderPrebill
      tags: [Orders]
      summary: Print a pre-bill for an order
      description: >
        Requires role `WAITER` or above. Prints to the active `CASHIER` printer: line items
        with prices and the total, but no payment method or paid marker - this is a courtesy
        printout for the guest to review before actually paying, not a receipt. Does not change
        `Order.status` or create a `Payment`. No-op (still returns 201, `attempted: false`, no
        `PrintJob` created) if there's no active `CASHIER` printer configured.
      responses:
        "201":
          description: Pre-bill print attempted (or skipped - see `attempted`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintAttemptResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelOrder
      tags: [Orders]
      summary: Cancel an order
      description: Requires role `WAITER` or above. No payment is created.
      responses:
        "200":
          description: Cancelled order (status `CANCELLED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Order not found
        "409":
          description: Order already `PAID`/`CANCELLED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shifts/open:
    post:
      operationId: openShift
      tags: [Shifts]
      summary: Open a shift for the calling user
      description: Requires role `CASHIER` or above. 409 if the calling user already has an open shift (enforced by a unique partial index, not just an application-level check).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftOpenInput"
      responses:
        "201":
          description: Shift opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "409":
          description: Caller already has an open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: You already have an open shift

  /shifts/current:
    get:
      operationId: getCurrentShift
      tags: [Shifts]
      summary: Get the calling user's currently open shift
      description: >
        Requires role `CASHIER` or above. Looks up by `openedByUserId` = the calling user's id
        AND `status=OPEN` - never returns another user's shift, even to a MANAGER/ADMIN caller.
        Lets a client on any device discover whether it already has an open shift without
        relying on browser local storage.
      responses:
        "200":
          description: The calling user's open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: The calling user has no open shift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: No open shift

  /shifts/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: closeShift
      tags: [Shifts]
      summary: Close a shift
      description: Requires role `CASHIER` or above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCloseInput"
      responses:
        "200":
          description: Closed shift (status `CLOSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found
        "409":
          description: >
            Already `CLOSED`, or there are `OPEN`/`SENT` orders anywhere in the system. This is
            a system-wide gate, not scoped to this particular shift - `Order` has no `shiftId`
            (only `Payment` does, and only once an order is closed), so there is no way to ask
            "orders opened during this shift" and the check intentionally doesn't pretend
            otherwise.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /shifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShift
      tags: [Shifts]
      summary: Get a shift summary
      description: >
        Requires role `CASHIER` or above. A caller whose role is exactly `CASHIER` (not
        `MANAGER`/`ADMIN`) may only fetch a shift they themselves opened - any other shift id
        404s for them, same as if it didn't exist, to avoid confirming another cashier's shift
        even exists. `MANAGER`/`ADMIN` can fetch any shift.
      responses:
        "200":
          description: The shift with payment totals broken out by method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /shifts/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: exportShift
      tags: [Shifts]
      summary: Export a shift's Z-report as CSV
      description: >
        Requires role `MANAGER` or above. This is the till-reconciliation report, not a raw
        payment dump: identifiers that only make sense to a database (order/booking/cashier
        UUIDs) are replaced with what a manager actually needs to read - the order's
        table/zone and item composition (or a short fallback if there's no table), the guest
        name and room for ROOM_CHARGE payments, and the cashier's email. The underlying
        `Payment.id`/`Order.id` are kept as the last two columns for support/audit lookups,
        not as the first thing a human sees. Timestamps are seconds-precision (`yyyy-MM-dd
        HH:mm:ss "UTC"`), not the millisecond ISO instant used elsewhere in the API.


        The file opens with a UTF-8 BOM and a `sep=,` directive line - see `GET
        /bookings/export`'s description for why.


        After the payment rows, a blank line separates a totals block (label, value per row):
        `Cash`/`Card`/`Other`/`Room charge (posted to room folio - not received cash/card)`
        (same per-method split and the same ROOM_CHARGE exclusion as `GET /payments/summary`
        - see that operation's description for why ROOM_CHARGE isn't received revenue),
        `Received total (cash + card + other)`, `Payments` (count), `Opening cash float`,
        `Expected cash (float + cash payments)`, `Counted cash` (the shift's
        `closingCashCounted`, or `—` if the shift hasn't been closed/recounted yet), and
        finally `Discrepancy (counted - expected)` - positive means the drawer has more cash
        than it should, negative means it's short. This last figure is the actual point of
        closing a shift.
      responses:
        "200":
          description: >
            CSV file: a header row, one row per payment recorded under this shift, a blank
            row, then the reconciliation totals block described above.
          content:
            text/csv:
              schema:
                type: string
                example: |
                  Time,Method,Amount,Order,Guest / Room,Cashier,Payment ID,Order ID
                  2026-08-08 20:26:40 UTC,ROOM_CHARGE,1080.00,Bar – Bar Seat 3: 2× Mojito; 1× Caesar salad,Jane Doe – Ocean View Suite,cashier@sunsetbeach.example,aa89f455-...,5de7944d-...

                  Summary,
                  Cash,3200.00
                  Card,1500.00
                  Other,0.00
                  Room charge (posted to room folio - not received cash/card),1080.00
                  Received total (cash + card + other),4700.00
                  Payments,5
                  Opening cash float,2000.00
                  Expected cash (float + cash payments),5200.00
                  Counted cash,5150.00
                  Discrepancy (counted - expected),-50.00
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Always `attachment; filename="shift-{id}.csv"`.'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"
        "404":
          description: Shift not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Shift not found

  /payments/summary:
    get:
      operationId: getPaymentsSummary
      tags: [Payments]
      summary: Get a payment totals summary for a date range
      description: >
        Requires role `MANAGER` or above. `from`/`to` are inclusive dates, filtered by
        `Payment.createdAt`. `totals` reuses the exact same per-method aggregation
        `GET /shifts/{id}` builds `ShiftSummary.totals` from - just scoped to a date range
        across all shifts instead of one shift (see `PaymentAggregation` in the backend; the
        arithmetic is not duplicated between the two).


        **`totals.roomCharge` is not received revenue.** It's money moved onto a guest's room
        folio at the moment a POS order was closed with `method=ROOM_CHARGE` - it only becomes
        real, collected revenue if/when the underlying `Booking` itself is later paid, which is
        a separate event this endpoint does not track (see `GET /bookings/{id}/folio`).
        Including it in a revenue total here would either double-count it (once here, again
        when the booking is paid) or count it before any money actually changed hands.
        `grandTotal` is therefore **`totals.cash + totals.card + totals.other` only** -
        `totals.roomCharge` is deliberately excluded and must be read as a separate "moved to
        room folios this period" figure, never added into `grandTotal` on the client.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date (by `Payment.createdAt`).
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date (by `Payment.createdAt`).
      responses:
        "200":
          description: Payment totals for the date range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsSummary"
        "400":
          description: '`from`/`to` missing, not a valid date, or `from` after `to`.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenManagerPlus"

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List staff users
      description: Requires an authenticated session with role `ADMIN`.
      responses:
        "200":
          description: All staff users (no `passwordHash`).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create a staff user
      description: Requires an authenticated session with role `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use (Prisma `P2002` unique constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a staff user by id
      description: Requires an authenticated session with role `ADMIN`.
      responses:
        "200":
          description: The staff user (no `passwordHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found
    patch:
      operationId: updateUserRole
      tags: [Users]
      summary: Change a staff user's role
      description: >
        Requires an authenticated session with role `ADMIN`. An admin
        cannot change their own role (blocked before any DB write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleUpdateInput"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: '`id` in the path is the caller''s own id, or body failed `userRoleUpdateSchema` validation.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                selfRoleChange:
                  value: { error: "You can't change your own role" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: User not found

  /public/rooms:
    get:
      operationId: listPublicRooms
      tags: [Public]
      summary: List all rooms (public)
      description: Unauthenticated. Powers the public room listing page. Nothing in `Room` is sensitive today, so it's reused as-is rather than duplicated into a narrower projection.
      security: []
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /public/rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoom
      tags: [Public]
      summary: Get a room by id (public)
      description: Unauthenticated. Powers the public room detail page.
      security: []
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /public/rooms/{id}/pricing:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomPricing
      tags: [Public]
      summary: Get per-day prices for a room for a given month (public)
      description: Unauthenticated. Same shape as the staff endpoint - `isOverride` isn't sensitive, it just means the day has an explicit rate.
      security: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Base price and the resolved price for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /public/rooms/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPublicRoomAvailability
      tags: [Public]
      summary: Get day-by-day availability for a room for a given month (public)
      description: >
        Unauthenticated. Powers the guest booking calendar. Unlike the staff
        endpoint, this never reveals *why* a day is blocked (real booking vs.
        manual staff block), nor how many units remain (`availableCount`) -
        only whether at least one unit is still bookable. Exposing the exact
        remaining count would let competitors read occupancy/load straight
        off the public site.
      security: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailabilityResponse"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /uploads/rooms/{roomId}/{filename}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
      - name: filename
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomImage
      tags: [Public]
      summary: Serve an uploaded room image
      description: >
        Unauthenticated. Serves files written under `UPLOADS_ROOT/rooms/{roomId}/`
        by `POST /rooms/{id}/images`. The path shape matches `Room.images`
        entries exactly (`/uploads/rooms/{id}/{filename}`); on the deployed
        VPS the reverse proxy in front of this service rewrites public
        `/uploads/...` requests to this app's `/api/uploads/...` route so
        `Room.images` values need no prefix rewriting on the frontend.
      security: []
      responses:
        "200":
          description: The image file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No such file (unknown room, unknown filename, or a path escaping the room's upload directory).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT returned by `POST /auth/login`, sent as `Authorization: Bearer
        <token>`. Contains `sub` (user id), `email`, `role`, standard `iat`/`exp`
        (default TTL 7 days, configurable via `JWT_TTL_DAYS`). Every route in
        this file except `POST /bookings` and the unauthenticated `/auth/*`
        endpoints (`login`, `logout`) requires a valid token, returning 401 if
        missing/invalid/expired, and 403 where the route additionally requires
        role `ADMIN`.

  responses:
    Unauthorized:
      description: No valid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Unauthorized
    Forbidden:
      description: Token is valid but lacks the required role (`ADMIN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenManagerPlus:
      description: Token is valid but lacks the required role (`MANAGER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden
    ForbiddenCashierPlus:
      description: Token is valid but lacks the required role (`CASHIER` or above).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Forbidden

  schemas:
    Role:
      type: string
      enum: [ADMIN, MANAGER, CASHIER, WAITER]
      description: >
        Hierarchical: ADMIN > MANAGER > CASHIER > WAITER (see RoleHierarchy bean). A role
        check written as e.g. "CASHIER" is satisfied by CASHIER, MANAGER, or ADMIN. `/users/**`
        is the one exception — hard-restricted to ADMIN regardless of hierarchy.

    Zone:
      type: string
      enum: [RESTAURANT, BAR, SPA, POOL, ROOM_SERVICE]
      description: Physical area a POS Table belongs to.

    MenuDepartment:
      type: string
      enum: [KITCHEN, BAR]
      description: >
        Where a MenuItem's kitchen/bar ticket prints - independent of `category`, which is a
        free-text display grouping for the menu itself (e.g. "Mains", "Cocktails") and has no
        effect on print routing.

    PrinterDepartment:
      type: string
      enum: [KITCHEN, BAR, CASHIER]
      description: >
        What a Printer receives. `KITCHEN`/`BAR` get routed kitchen/bar tickets (split from
        order line items by `MenuItem.department`); `CASHIER` gets pre-bills, guest receipts,
        and shift Z-reports - nothing routed by menu department ever goes there.

    PrinterCodepage:
      type: string
      enum: [PC437, TIS620]
      description: >
        The single-byte ESC/POS code page text is encoded into before sending, since receipts
        can contain non-ASCII (guest names, menu item names) and Latin/Thai need different
        tables. `PC437` (the standard US/Latin ESC/POS code page) is the default; `TIS620`
        covers Thai. Not a hardcoded global setting - each Printer picks its own, since a hotel
        can have Latin-only and Thai-capable printers side by side.

    PrintDocumentType:
      type: string
      enum: [KITCHEN_TICKET, BAR_TICKET, PREBILL, GUEST_RECEIPT, Z_REPORT, TEST_PAGE]
      description: >
        `KITCHEN_TICKET` and `BAR_TICKET` are the two station tickets an order send splits into
        by `MenuItem.department` - separate values (not one type disambiguated by `summary` text)
        so the queue can be filtered to a single station.

    PrintJobStatus:
      type: string
      enum: [PENDING, SENT, FAILED]
      description: >
        PENDING = queued, either freshly created or waiting for the next automatic retry.
        SENT = delivered successfully (terminal). FAILED = automatic retries exhausted
        (terminal until a manual retry via `POST /print-jobs/{id}/retry` puts it back in play).

    Printer:
      type: object
      required: [id, name, department, host, port, codepage, isActive, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        department:
          $ref: "#/components/schemas/PrinterDepartment"
        host:
          type: string
          description: IP address or hostname on the hotel's local network.
        port:
          type: integer
          description: 'Almost always 9100 (raw ESC/POS-over-TCP) on real hardware.'
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
        isActive:
          type: boolean
          description: 'Whether this is currently the live printer for its `department` - see `Printer_one_active_per_department`.'
        createdAt:
          type: string
          format: date-time

    PrinterInput:
      type: object
      description: Full replacement on PATCH — no partial update (same convention as `MenuItemInput`/`TableInput`).
      required: [name, department, host]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        department:
          $ref: "#/components/schemas/PrinterDepartment"
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9100
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
          default: PC437
        isActive:
          type: boolean
          default: true

    PrintJob:
      type: object
      description: >
        A queued/attempted print. `payload` (the raw ESC/POS bytes actually sent) is
        intentionally not exposed here - it's binary and only meaningful to a printer.
      required: [id, printerId, documentType, summary, status, attempts, lastError, createdAt, updatedAt]
      properties:
        id:
          type: string
        printerId:
          type: string
        documentType:
          $ref: "#/components/schemas/PrintDocumentType"
        summary:
          type: string
          description: >
            Human-readable one-liner, e.g. "Kitchen ticket — Order #ab12cd34" or
            "Bar ticket — Order #ab12cd34" or, for a
            `GUEST_RECEIPT`, "Guest receipt — Order #ab12cd34 (CARD)" /
            "Guest receipt — Order #ab12cd34 (ROOM_CHARGE — Jane Doe)" - enough to tell two
            receipts on the same order apart without opening `GET /print-jobs/{id}/preview`.
            Never carries a money amount.
        status:
          $ref: "#/components/schemas/PrintJobStatus"
        attempts:
          type: integer
          description: Number of delivery attempts made so far (automatic + manual).
        lastError:
          type: string
          nullable: true
          description: 'Exception message from the most recent failed attempt; null if it has never failed.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PrintAttemptResult:
      type: object
      description: Result of an on-demand print action that may legitimately have nothing to print to.
      required: [attempted]
      properties:
        attempted:
          type: boolean
          description: 'false when there was no active printer configured for the target department - nothing was queued.'
        job:
          $ref: "#/components/schemas/PrintJob"
          nullable: true
          description: 'null when `attempted` is false.'

    OrderStatus:
      type: string
      enum: [OPEN, SENT, PAID, CANCELLED]
      description: >
        OPEN (being built) -> SENT (sent to kitchen/bar, still editable-ish per business
        rule) -> PAID (closed with a Payment) or CANCELLED. PAID and CANCELLED are terminal.

    PaymentMethod:
      type: string
      enum: [CASH, CARD, ROOM_CHARGE, OTHER]
      description: >
        CARD is a ledger entry recorded on the cashier's word, not a confirmation from a
        payment terminal/acquirer — there is no card-processing integration.

    ShiftStatus:
      type: string
      enum: [OPEN, CLOSED]

    BookingStatus:
      type: string
      enum: [NEW, CONFIRMED, PAID, CANCELLED]

    ErrorMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
      description: 'Generic error shape used by all hand-written `{ error: "..." }` responses.'

    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Output of Zod's `error.flatten()`.
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
      example:
        error:
          formErrors: []
          fieldErrors:
            guestEmail: ["Invalid email"]

    OkTrue:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    OkUpdated:
      type: object
      required: [ok, updated]
      properties:
        ok:
          type: boolean
          enum: [true]
        updated:
          type: integer
          description: Number of day rows upserted.

    Room:
      type: object
      description: >
        Despite the name this is a **room type**, not a single physical room — individual
        sellable units are separate `RoomUnit` rows (see the RoomUnits tag). `activeUnitCount`
        is computed from those rows (`count(RoomUnit WHERE roomId = id AND isActive)`), not
        stored. `basePrice` is a Prisma `Decimal` — it serializes to a **string**, not a JSON
        number. `createdAt` serializes as an ISO-8601 datetime string.
      required: [id, name, description, capacity, activeUnitCount, basePrice, images, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        activeUnitCount:
          type: integer
          minimum: 0
          description: 'Computed - number of active (`isActive: true`) `RoomUnit` rows of this type.'
        basePrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1500.00"`.
        images:
          type: array
          items:
            type: string
          description: Paths under `/uploads/rooms/{id}/...`.
        createdAt:
          type: string
          format: date-time

    RoomInput:
      type: object
      description: >
        Body of `roomSchema`. Full replacement on PATCH — no partial update. Does not include a
        unit count - a room type has zero sellable units until `RoomUnit`s are added for it via
        `POST /room-units`.
      required: [name, description, capacity, basePrice]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 10
        capacity:
          type: integer
          minimum: 1
          maximum: 20
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.

    RoomUnit:
      type: object
      description: A single physical room ("203", "Garden Bungalow 4") - one sellable unit of a Room type.
      required: [id, roomId, label, isActive, createdAt]
      properties:
        id:
          type: string
        roomId:
          type: string
        label:
          type: string
          description: Unique hotel-wide, not just within the room type.
        isActive:
          type: boolean
          description: Inactive units are excluded from `Room.activeUnitCount` and cannot be newly assigned to a booking.
        createdAt:
          type: string
          format: date-time

    RoomUnitInput:
      type: object
      description: Body of `POST /room-units`.
      required: [roomId, label]
      properties:
        roomId:
          type: string
        label:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean
          default: true

    RoomUnitUpdateInput:
      type: object
      description: Body of `PATCH /room-units/{id}`. Full replacement of `label`/`isActive` — `roomId` is immutable after creation.
      required: [label, isActive]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        isActive:
          type: boolean

    RoomUnitBlock:
      type: object
      description: >
        A physical room pulled off sale for a date range, with a reason. Replaces the old
        Room-level `Availability.blockedCount`. `fromDate`/`toDate` are both inclusive.
      required: [id, roomUnitId, fromDate, toDate, reason, createdAt]
      properties:
        id:
          type: string
        roomUnitId:
          type: string
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        toDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    RoomUnitBlockInput:
      type: object
      description: Body of `POST /room-units/{id}/blocks`.
      required: [fromDate, toDate, reason]
      properties:
        fromDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        toDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        reason:
          type: string
          minLength: 1
      # Cross-field rule: fromDate <= toDate (matches RoomUnitBlock_date_range_check).

    RoomUnitAssignmentInput:
      type: object
      description: Body of `PUT /bookings/{id}/room-unit`.
      required: [roomUnitId]
      properties:
        roomUnitId:
          type: string
          nullable: true
          description: The room unit to assign, or `null` to clear the current assignment.

    Booking:
      type: object
      description: >
        Raw Prisma `Booking` row with `room` included. `totalPrice`
        serializes as a **string** (Prisma `Decimal`). `checkIn`, `checkOut`,
        `createdAt`, `updatedAt` serialize as ISO-8601 datetime strings
        (`checkIn`/`checkOut` are date-only columns but still render with a
        `T00:00:00.000Z` time component since Prisma returns `Date` objects).
        `roomUnitId`/`roomUnit` are null until a physical room is assigned via
        `PUT /bookings/{id}/room-unit` - `roomId`/`room` (the room *type*) stay the source of
        truth for what was booked either way.
      required:
        - id
        - roomId
        - room
        - roomUnitId
        - roomUnit
        - guestName
        - guestEmail
        - guestPhone
        - checkIn
        - checkOut
        - totalPrice
        - status
        - paymentNote
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        roomId:
          type: string
        room:
          $ref: "#/components/schemas/Room"
        roomUnitId:
          type: string
          nullable: true
        roomUnit:
          $ref: "#/components/schemas/RoomUnit"
          nullable: true
        guestName:
          type: string
        guestEmail:
          type: string
        guestPhone:
          type: string
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        totalPrice:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"4500.00"`. Always server-computed, never taken from the request.
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingCreateInput:
      type: object
      description: Body of `bookingCreateSchema`.
      required: [roomId, guestName, guestEmail, guestPhone, checkIn, checkOut]
      properties:
        roomId:
          type: string
          minLength: 1
        guestName:
          type: string
          minLength: 2
          maxLength: 120
        guestEmail:
          type: string
          format: email
        guestPhone:
          type: string
          minLength: 5
          maxLength: 40
        checkIn:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        checkOut:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      # Cross-field rule enforced by Zod .refine(), not expressible in JSON Schema:
      # checkIn must be strictly before checkOut.

    BookingStatusInput:
      type: object
      description: Body of `bookingStatusSchema`.
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentNote:
          type: string
          maxLength: 500
          nullable: true

    User:
      type: object
      description: Safe projection returned by the API — `passwordHash` is never included.
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: "JWT to send as `Authorization: Bearer <token>` on subsequent requests."
        user:
          $ref: "#/components/schemas/User"

    UserCreateInput:
      type: object
      description: Body of `userCreateSchema`.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 200
          description: Hashed with bcrypt (cost 10) before storage; never stored or returned in plaintext.
        role:
          $ref: "#/components/schemas/Role"
          default: MANAGER

    UserRoleUpdateInput:
      type: object
      description: Body of `userRoleUpdateSchema`.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    PriceRangeInput:
      type: object
      description: Body of `priceRangeSchema`. Upserts one `RatePlan` row per day in `[from, to]`.
      required: [from, to, price]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Coerced to a number server-side (`z.coerce.number()`); a numeric string is also accepted.
      # Cross-field rule enforced by Zod .refine(): from <= to.

    PricingDay:
      type: object
      required: [date, price, isOverride]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        price:
          type: number
          description: Explicitly converted with `Number(...)` server-side — a real JSON number, unlike `Room.basePrice`.
        isOverride:
          type: boolean
          description: 'True if this day has an explicit `RatePlan` row; false if it fell back to `Room.basePrice`.'

    PricingResponse:
      type: object
      required: [basePrice, days]
      properties:
        basePrice:
          type: number
          description: 'Room.basePrice explicitly converted with `Number(...)`.'
        days:
          type: array
          items:
            $ref: "#/components/schemas/PricingDay"

    RoomUnitAvailability:
      type: object
      description: Per-day status of one physical room - the data the booking calendar grid renders per cell.
      required: [roomUnitId, label, isBlocked, isBooked, isAvailable, bookingId, blockReason]
      properties:
        roomUnitId:
          type: string
        label:
          type: string
        isBlocked:
          type: boolean
          description: True if a `RoomUnitBlock` covers this day.
        isBooked:
          type: boolean
          description: True if a non-CANCELLED booking has this unit assigned and covers this day.
        isAvailable:
          type: boolean
          description: '`!isBlocked && !isBooked`.'
        bookingId:
          type: string
          nullable: true
          description: Set when `isBooked` is true.
        blockReason:
          type: string
          nullable: true
          description: Set when `isBlocked` is true (`RoomUnitBlock.reason`).

    AvailabilityDay:
      type: object
      description: >
        Per-day inventory breakdown for staff, at both the room-type level (`unitCount`,
        `blockedCount`, `bookedCount`, `availableCount`) and the physical-room level (`units[]`).
        `availableCount` is the derived remainder (`unitCount - blockedCount - bookedCount`) and
        can go negative - that's not clamped away, since a negative remainder (e.g. after room
        units are deactivated) is exactly the thing staff need to see, not hide. `blockedCount`
        counts *distinct* blocked active units for the day (an overlapping second block on the
        same unit doesn't double-count); `bookedCount` counts bookings covering the day
        regardless of whether they have an assigned unit - an unassigned booking still occupies
        one unit of the type.
      required: [date, unitCount, blockedCount, bookedCount, availableCount, units]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        unitCount:
          type: integer
          description: Number of active `RoomUnit`s of this type at query time.
        blockedCount:
          type: integer
          description: Distinct active units with a `RoomUnitBlock` covering this day.
        bookedCount:
          type: integer
          description: Units covered by a non-CANCELLED booking for this day (assigned or not).
        availableCount:
          type: integer
          description: 'unitCount - blockedCount - bookedCount. Not clamped at 0.'
        units:
          type: array
          items:
            $ref: "#/components/schemas/RoomUnitAvailability"
          description: One entry per active `RoomUnit` of this type.

    AvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilityDay"

    PublicAvailabilityDay:
      type: object
      description: >
        Like `AvailabilityDay` but collapsed to a yes/no signal - guests get
        neither the block/booking split nor the exact remaining count
        (revealing occupancy load to competitors), just whether at least one
        unit is still sellable.
      required: [date, isBlocked]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        isBlocked:
          type: boolean
          description: 'True when availableCount <= 0 for this day.'

    PublicAvailabilityResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/PublicAvailabilityDay"

    MenuItem:
      type: object
      required: [id, name, description, category, department, price, isAvailable, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        department:
          $ref: "#/components/schemas/MenuDepartment"
        price:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"250.00"` — same convention as `Room.basePrice`.
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MenuItemInput:
      type: object
      description: >
        Full replacement on PATCH — no partial update (same convention as `RoomInput`).
        `department` defaults to `KITCHEN` (most menu items are food) - existing rows migrated
        the same way; staff reassign drinks to `BAR` explicitly.
      required: [name, description, category, price]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          type: string
          minLength: 1
          maxLength: 60
        department:
          $ref: "#/components/schemas/MenuDepartment"
          default: KITCHEN
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
        isAvailable:
          type: boolean
          default: true

    Table:
      type: object
      description: >
        A physical POS table/spot a guest tab can be opened against. Mapped to a
        `PosTable` database table (not `Table`) to sidestep the SQL keyword collision — the
        API schema name is unaffected.
      required: [id, zone, label, capacity, isActive]
      properties:
        id:
          type: string
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    TableInput:
      type: object
      description: Full replacement on PATCH — no partial update.
      required: [zone, label, capacity]
      properties:
        zone:
          $ref: "#/components/schemas/Zone"
        label:
          type: string
          minLength: 1
          maxLength: 60
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        isActive:
          type: boolean
          default: true

    OrderItem:
      type: object
      description: A single line of an Order. `unitPrice` is a snapshot of `MenuItem.price` at the moment the item was added — later menu price changes never retroactively affect it.
      required: [id, orderId, menuItemId, quantity, unitPrice, note, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        menuItemId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
          description: Decimal(10,2) rendered as a string, snapshotted at insert time.
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Order:
      type: object
      description: >
        `total` is always server-computed from `items` — never taken from the client (same
        rule as `Booking.totalPrice`).
      required: [id, tableId, bookingId, guestName, status, openedByUserId, total, note, items, createdAt, updatedAt]
      properties:
        id:
          type: string
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
        guestName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        openedByUserId:
          type: string
        total:
          type: string
          description: Decimal(10,2) rendered as a string, e.g. `"1250.00"`.
        note:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderCreateInput:
      type: object
      description: At least one of `tableId`/`bookingId`/`guestName` is expected in practice (an order with none of them is a valid but untraceable tab), but this isn't enforced server-side — same "trust the caller on shape, not on price" spirit as elsewhere.
      properties:
        tableId:
          type: string
          nullable: true
        bookingId:
          type: string
          nullable: true
        guestName:
          type: string
          nullable: true
          maxLength: 120

    OrderUpdateInput:
      type: object
      description: >
        Partial update (unlike `RoomInput`/`MenuItemInput`/`TableInput`): an omitted field
        leaves the existing value alone, an explicit `null` on `note`/`tableId` clears it.
        The only legal `status` transition through this endpoint is `OPEN` -> `SENT`; any
        other value (including trying to set `PAID`/`CANCELLED` here instead of through
        `/close` or `/cancel`) is rejected with 400.
      properties:
        note:
          type: string
          nullable: true
          maxLength: 1000
        tableId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"

    OrderItemInput:
      type: object
      description: >
        Used both as the array body of `POST /orders/{id}/items` (create) and the single-object
        body of `PATCH /orders/{id}/items/{itemId}` (full replacement of `quantity`/`note` for
        that line — `menuItemId` is immutable after creation but still required in the body for
        symmetry with the create shape; the server ignores it on PATCH).
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: string
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
          nullable: true
          maxLength: 500

    CloseOrderInput:
      type: object
      description: >
        Body of `POST /orders/{id}/close`. No `amount` field: there's no partial-payment
        model (an `Order` goes straight to the terminal `PAID` status on the first close, it
        can't accumulate multiple payments), so the amount charged is never a client-supplied
        number - the server always charges `Order.total` exactly, the same "never trust the
        client on money" rule as `Booking.totalPrice`/`Order.total` itself. `bookingId` is
        required when `method` is `ROOM_CHARGE` — a cross-field rule enforced server-side, not
        expressible in JSON Schema (same pattern as `BookingCreateInput`'s `checkIn < checkOut`).
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        bookingId:
          type: string

    Payment:
      type: object
      required: [id, orderId, method, amount, bookingId, recordedByUserId, shiftId, createdAt]
      properties:
        id:
          type: string
        orderId:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: string
          description: Decimal(10,2) rendered as a string.
        bookingId:
          type: string
          nullable: true
          description: Set only when `method` is `ROOM_CHARGE`.
        recordedByUserId:
          type: string
        shiftId:
          type: string
        createdAt:
          type: string
          format: date-time

    Shift:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true

    ShiftOpenInput:
      type: object
      properties:
        openingCashFloat:
          type: number
          minimum: 0

    ShiftCloseInput:
      type: object
      properties:
        closingCashCounted:
          type: number
          minimum: 0
        notes:
          type: string
          nullable: true
          maxLength: 1000

    ShiftTotals:
      type: object
      description: Sum of this shift's `Payment.amount`, broken out by method — CASH/CARD/OTHER only; ROOM_CHARGE payments settle against the room folio, not this shift's cash/card reconciliation, so they're reported separately as `roomCharge`.
      required: [cash, card, roomCharge, other, paymentCount]
      properties:
        cash:
          type: string
          description: Decimal(10,2) rendered as a string.
        card:
          type: string
          description: Decimal(10,2) rendered as a string.
        roomCharge:
          type: string
          description: Decimal(10,2) rendered as a string.
        other:
          type: string
          description: Decimal(10,2) rendered as a string.
        paymentCount:
          type: integer

    ShiftSummary:
      type: object
      required: [id, openedByUserId, openedAt, closedByUserId, closedAt, openingCashFloat, closingCashCounted, status, notes, totals]
      properties:
        id:
          type: string
        openedByUserId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        openingCashFloat:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        closingCashCounted:
          type: string
          nullable: true
          description: Decimal(10,2) rendered as a string.
        status:
          $ref: "#/components/schemas/ShiftStatus"
        notes:
          type: string
          nullable: true
        totals:
          $ref: "#/components/schemas/ShiftTotals"

    BookingPosOrderItem:
      type: object
      description: Compact line-item summary - menu item name (not id) and quantity, nothing else.
      required: [name, quantity]
      properties:
        name:
          type: string
        quantity:
          type: integer

    BookingPosOrder:
      type: object
      description: One `Order` that was closed with `method=ROOM_CHARGE` against this booking.
      required: [orderId, amount, paidAt, items]
      properties:
        orderId:
          type: string
        amount:
          type: string
          description: The `Payment.amount` recorded when this order was closed - decimal(10,2) rendered as a string.
        paidAt:
          type: string
          format: date-time
          description: '`Payment.createdAt` - when the order was closed, not when the order was opened.'
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingPosOrderItem"

    BookingFolio:
      type: object
      description: >
        `folioTotal` = `roomTotal` + `roomChargesTotal`, computed on the fly by
        `BookingService.computeFolio`/`getFolio` - see that method's Javadoc. Never stored.
      required: [roomTotal, roomChargesTotal, folioTotal, roomChargeCount]
      properties:
        roomTotal:
          type: string
          description: '`Booking.totalPrice` - decimal(10,2) rendered as a string.'
        roomChargesTotal:
          type: string
          description: Sum of this booking's ROOM_CHARGE `Payment.amount` rows - decimal(10,2) rendered as a string.
        folioTotal:
          type: string
          description: '`roomTotal` + `roomChargesTotal` - decimal(10,2) rendered as a string.'
        roomChargeCount:
          type: integer
          description: Number of ROOM_CHARGE payments summed into `roomChargesTotal` - same count as `GET /bookings/{id}/pos-orders` would return entries.

    PaymentsSummary:
      type: object
      description: >
        Response of `GET /payments/summary`. See that operation's description for why
        `totals.roomCharge` is excluded from `grandTotal` - do not sum `totals.*` yourself on
        the client, use `grandTotal` as-is for received revenue.
      required: [from, to, totals, grandTotal]
      properties:
        from:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        to:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        totals:
          $ref: "#/components/schemas/ShiftTotals"
        grandTotal:
          type: string
          description: '`totals.cash + totals.card + totals.other` - decimal(10,2) rendered as a string. Deliberately excludes `totals.roomCharge`.'
