  /bookings/{id}/room-unit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignBookingRoomUnit
      tags: [Bookings]
      summary: Assign or unassign the physical room for a booking
      description: >
        Requires CASHIER or above. One endpoint for both directions: a non-null `roomUnitId`
        assigns that physical room to the booking, `null` clears the assignment. Deliberately
        not part of `PATCH /bookings/{id}` - room assignment has its own validation (same room
        type, active, free for the whole stay) and its own race-safety story (SERIALIZABLE,
        same pattern as `POST /bookings`), so it gets its own operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnitAssignmentInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The room unit belongs to a different room type, or is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                wrongType:
                  value: { error: "Room 5 is a different room type than this booking" }
                inactive:
                  value: { error: "Room 5 is not active" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCashierPlus"
        "404":
          description: Booking or room unit not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: >
            The room unit is blocked or already booked for an overlapping stay - either found
            up front or from a concurrent conflicting assignment (Postgres serialization
            failure, SQLSTATE `40001`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                blocked:
                  value: { error: "Room 5 is blocked (under renovation) from 2026-08-05 to 2026-08-09" }
                booked:
                  value: { error: "Room 5 is already booked for an overlapping stay" }
                raceLost:
                  value: { error: "Someone just assigned this room — please try again." }

