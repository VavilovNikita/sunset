openapi: 3.0.3
info:
  title: Sunset Beach Resort & Spa — Admin/Booking API
  description: >
    Contract reverse-engineered from the current Next.js route handlers under
    `app/api/**/route.ts`. It documents exactly what each route accepts and
    returns today (including quirks such as Prisma `Decimal`/`Date` JSON
    serialization), so it can serve as a migration contract for a backend
    rewrite in another language. No behavior was changed to produce this spec.
  version: "1.0.0"
  license:
    name: Proprietary
servers:
  - url: /api
    description: Relative to the deployed Next.js app origin.

tags:
  - name: Auth
    description: >
      Self-hosted authentication - this app owns the `User` table and issues/verifies
      its own JWTs. Replaces the old NextAuth.js-managed cookie session.
  - name: Rooms
    description: Room CRUD and image management (staff only).
  - name: Pricing
    description: Per-day rate overrides for a room (staff only).
  - name: Availability
    description: Manual availability blocks for a room (staff only).
  - name: Bookings
    description: Guest booking creation (public) and status management/export (staff only).
  - name: Menu
    description: POS menu item catalog (staff reads, MANAGER or above manages).
  - name: Tables
    description: POS restaurant/bar/spa/pool tables (staff reads, MANAGER or above manages).
  - name: Orders
    description: >
      POS orders and their line items (WAITER or above opens/edits; CASHIER or above closes
      or cancels — cancel is available to WAITER too, only closing requires CASHIER).
  - name: Shifts
    description: POS cashier shift open/close and cash reconciliation (CASHIER or above).
  - name: Payments
    description: Cross-shift POS payment reporting for a date range (MANAGER or above).
  - name: Users
    description: Staff account management (ADMIN only).
  - name: Public
    description: >
      Unauthenticated, guest-facing reads for the public site (room listing,
      room detail, monthly pricing/availability for the booking calendar) and
      static serving of uploaded room images. Distinct from the staff-only
      Rooms/Pricing/Availability tags: no session required, and availability
      here never reveals whether a blocked day is a real booking or a manual
      staff block.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email/password
      description: >
        Verifies `email`/`password` against `User.passwordHash` (bcrypt) and, on
        success, returns a JWT to send as `Authorization: Bearer <token>` on
        subsequent requests. No server-side session is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Email not found or password incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Invalid email or password

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Create a staff user (alias of POST /users)
      description: >
        Requires an authenticated session with role `ADMIN`. Identical
        behavior to `POST /users` - see that operation for the full response/
        error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateInput"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Body failed `userCreateSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: A user with that email already exists

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the currently authenticated user
      description: "Requires a valid `Authorization: Bearer` JWT."
      responses:
        "200":
          description: The authenticated user (no `passwordHash`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out
      description: >
        No-op on this side - JWTs are stateless and not revoked server-side.
        Real logout is the client discarding the token.
      security: []
      responses:
        "204":
          description: Always succeeds.

  /rooms:
    get:
      operationId: listRooms
      tags: [Rooms]
      summary: List all rooms
      description: Requires any authenticated staff session (ADMIN or MANAGER). No pagination (small hotel).
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRoom
      tags: [Rooms]
      summary: Create a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Room created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoom
      tags: [Rooms]
      summary: Get a room by id
      description: Requires any authenticated staff session (ADMIN or MANAGER). Used to prefill the admin edit form.
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: updateRoom
      tags: [Rooms]
      summary: Update a room
      description: Requires any authenticated staff session (ADMIN or MANAGER). Full replacement of all `roomSchema` fields (no partial update).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Updated room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Body failed `roomSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: >
            `quantity` was lowered below the peak number of units already
            committed (booked or manually blocked) on some future date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: "Cannot reduce quantity to 1: 3 units are already committed on at least one future date"
    delete:
      operationId: deleteRoom
      tags: [Rooms]
      summary: Delete a room
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTrue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: Room has existing bookings and cannot be deleted (Prisma `P2003`, FK constraint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: This room has existing bookings and can't be deleted.

  /rooms/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: uploadRoomImages
      tags: [Rooms]
      summary: Upload one or more room images
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Files
        are written to `public/uploads/rooms/{id}/` under a randomized
        filename and appended to `Room.images`. All files in the request are
        validated (type + size) before any are written; the first violation
        aborts the whole request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more image files. Field name must be repeated as `files` per file.
              required: [files]
      responses:
        "201":
          description: Room updated with the new image paths appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: No files provided, an unsupported MIME type, or a file over 8MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                noFiles:
                  value: { error: "No files provided" }
                unsupportedType:
                  value: { error: "Unsupported file type: image/gif" }
                tooLarge:
                  value: { error: "photo.jpg exceeds the 8MB limit" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    delete:
      operationId: deleteRoomImage
      tags: [Rooms]
      summary: Remove a room image
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Removes
        the given path from `Room.images` and, if it points under this
        room's upload directory, deletes the file from disk (best-effort —
        failure to unlink is ignored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Exact image path as stored in `Room.images`, e.g. `/uploads/rooms/{id}/169...-ab12cd.jpg`.
      responses:
        "200":
          description: Room updated with the image path removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: '`path` missing or not a string.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: path is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /pricing/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomPricing
      tags: [Pricing]
      summary: Get per-day prices for a room for a given month
      description: Requires any authenticated staff session (ADMIN or MANAGER).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Base price and the resolved price for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: setRoomPricing
      tags: [Pricing]
      summary: Set a price override for a date range
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Upserts
        one `RatePlan` row per day in `[from, to]` (inclusive). Rejects
        ranges longer than 366 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceRangeInput"
      responses:
        "200":
          description: Number of days upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkUpdated"
        "400":
          description: Body failed `priceRangeSchema` validation, or the range exceeds 366 days.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                tooLarge:
                  value: { error: "Range too large (max 366 days)" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /availability/{roomId}:
    parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRoomAvailability
      tags: [Availability]
      summary: Get day-by-day availability for a room for a given month
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Returns
        the full per-day inventory breakdown (`quantity`, `blockedCount`,
        `bookedCount`, `availableCount`) so staff can see manual blocks and
        real bookings separately rather than a single blocked/not-blocked
        flag. A day counts as booked if it is covered by a non-CANCELLED
        booking (`checkIn <= date < checkOut`).
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: 'Month key `YYYY-MM`. Defaults to the current UTC month.'
      responses:
        "200":
          description: Availability for every day of the month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
    patch:
      operationId: setRoomAvailability
      tags: [Availability]
      summary: Set how many units are manually blocked for a date range
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Upserts
        one `Availability` row per day in `[from, to]` (inclusive) with
        `blockedCount` units withdrawn from sale (`blockedCount: 0` deletes
        the row instead). Rejects ranges longer than 366 days. This never
        touches bookings — it only controls the manual-block layer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRangeInput"
      responses:
        "200":
          description: Number of days upserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkUpdated"
        "400":
          description: >
            Body failed `availabilityRangeSchema` validation, the range
            exceeds 366 days, or `blockedCount` exceeds the room's `quantity`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ErrorMessage"
              examples:
                tooLarge:
                  value: { error: "Range too large (max 366 days)" }
                overQuantity:
                  value: { error: "blockedCount cannot exceed the room's quantity (2)" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found

  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: List bookings
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Filters
        mirror `GET /bookings/export`. Ordered by `checkIn` ascending.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Matching bookings, ordered by `checkIn` ascending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Create a booking (public — guest-facing, no session required)
      description: >
        Intentionally unauthenticated: guests are not logged in. The server
        recomputes `totalPrice` from `Room.basePrice`/`RatePlan` and
        re-validates availability itself inside a `Serializable` transaction
        — nothing the client sends about price or availability is trusted.
        Sends a new-booking notification email on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateInput"
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed `bookingCreateSchema` validation (includes `checkIn < checkOut`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Room not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Room not found
        "409":
          description: >
            Requested dates are no longer available — either lost a race to
            another booking (checked inside the transaction) or the
            underlying Postgres serialization failure (Prisma `P2034`) from
            a concurrent conflicting request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              examples:
                unavailable:
                  value: { error: "Selected dates are no longer available" }
                serializationConflict:
                  value: { error: "Someone just booked these dates — please try again." }

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: Get a booking by id
      description: Requires any authenticated staff session (ADMIN or MANAGER). Used by the admin detail/status-change screen.
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found
    patch:
      operationId: updateBookingStatus
      tags: [Bookings]
      summary: Update a booking's status / payment note
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER). Sends a
        guest-facing status-change email on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Updated booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Body failed `bookingStatusSchema` validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found (Prisma `P2025`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/{id}/folio:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getBookingFolio
      tags: [Bookings]
      summary: Get the total amount owed against a booking's room folio
      description: >
        Requires any authenticated staff session. `roomTotal` + `roomChargesTotal` = `folioTotal`
        - built on the same `BookingService` query `GET /bookings/{id}/pos-orders` itemizes (see
        that operation), just totaled instead of broken out per order.
      responses:
        "200":
          description: The booking's folio total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingFolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/{id}/pos-orders:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listBookingPosOrders
      tags: [Bookings]
      summary: List POS orders charged to a booking's room folio
      description: >
        Requires any authenticated staff session. One entry per `Order` that has a `Payment`
        with `method=ROOM_CHARGE` and `bookingId` equal to this booking (built from the same
        underlying query `BookingService.computeFolio` sums over - see that method's Javadoc).
        Each entry carries a short item breakdown so the admin "Room charges" view can render
        without a follow-up `GET /orders/{id}` per row.
      responses:
        "200":
          description: Room-charge orders for this booking, oldest first. Empty array if none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingPosOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Booking not found

  /bookings/export:
    get:
      operationId: exportBookings
      tags: [Bookings]
      summary: Export bookings as CSV
      description: >
        Requires any authenticated staff session (ADMIN or MANAGER).


        The file opens with a UTF-8 BOM followed by a `sep=,` directive line so it opens
        correctly by double-click in Excel regardless of the OS's regional list-separator
        setting (a ru-RU/de-DE/etc. Windows defaults that to `;`, which is why a plain
        comma-CSV lands as one column there) - see `CsvBuilder` in the backend. Both CSV
        exports (`GET /bookings/export` and `GET /shifts/{id}/export`) share this same
        preamble/escaping so they can't drift apart.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Include bookings whose `checkOut` is after this date (i.e. still relevant on/after `from`).
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: 'Include bookings whose `checkIn` is on or before this date - together with `from`, a proper closed-range/half-open-stay overlap test (so `from=to=<today>` finds a booking checking in today).'
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: >
            CSV file, one row per booking, ordered by `checkIn` ascending. Prefixed with a
            UTF-8 BOM and a `sep=,` directive line (not shown in the example below) - see this
            operation's description.
          content:
            text/csv:
              schema:
                type: string
